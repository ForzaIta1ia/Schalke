name: Schalke News aktualisieren
on:
  schedule:
    - cron: "7 * * * *"   # jede Stunde
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/fetch-news.mjs
      - name: Commit
        run: |
          git config user.name "news-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs/news.json
          git diff --staged --quiet || (git commit -m "News update" && git push)
